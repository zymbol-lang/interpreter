[package]
name = "zymbol-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AST-to-bytecode compiler for Zymbol-Lang"

[dependencies]
zymbol-bytecode.workspace = true
zymbol-ast.workspace = true
zymbol-common.workspace = true
zymbol-lexer.workspace = true
zymbol-parser.workspace = true
zymbol-span.workspace = true
zymbol-semantic = { path = "../zymbol-semantic" }
zymbol-error.workspace = true
thiserror.workspace = true

[features]
# Off by default since v0.0.11 (D4); `zymbol-cli`'s `db` feature turns it on.
default = []
# Registers the std/db builtin ids at `<# std/db` compile time. Pure cfg flag
# (no extra deps); mirrors the `db` feature of zymbol-interpreter/zymbol-vm.
db = []
# Registers the std/net builtin ids. Pure cfg flag, like `db`; mirrors the
# `http` feature of zymbol-interpreter/zymbol-vm.
http = []

[dev-dependencies]
bincode.workspace = true
