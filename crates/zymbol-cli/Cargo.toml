[package]
name = "zymbol-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for Zymbol-Lang interpreter"

[[bin]]
name = "zymbol"
path = "src/main.rs"

[dependencies]
zymbol-span.workspace = true
zymbol-common.workspace = true
zymbol-error.workspace = true
zymbol-ast.workspace = true
zymbol-lexer.workspace = true
zymbol-parser.workspace = true
zymbol-semantic.workspace = true
zymbol-interpreter.workspace = true
zymbol-standalone.workspace = true
zymbol-bytecode.workspace = true
zymbol-vm.workspace = true
zymbol-compiler.workspace = true
zymbol-formatter.workspace = true
zymbol-repl.workspace = true
zymbol-package.workspace = true
zymbol-lsp = { path = "../zymbol-lsp" }
clap.workspace = true
anyhow.workspace = true
tempfile.workspace = true
tokio = { version = "1", features = ["full"] }

[features]
# Off by default since v0.0.11 (decision D4): with it the binary needs
# libodbc.so.2 and libltdl.so.7 just to START, and a static one cannot have it
# at all (the ODBC driver manager loads drivers with dlopen). `--features db`
# turns it on — the Windows release and the gate build that way.
default = []
# std/db (ODBC) in both engines. See REFERENCE.md L17.
db = ["zymbol-interpreter/db", "zymbol-vm/db", "zymbol-compiler/db"]

# The static Linux binary's allocator (GLB-134): musl's malloc made building a
# text 2.1 times slower than glibc's at v0.0.11, 17 times at v0.0.10. Only the
# musl target links it; every other build keeps the system allocator.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }
# `extended`, for `mi_option_set`: see `tune_allocator` in main.rs.
libmimalloc-sys = { version = "0.1", features = ["extended"] }

[dev-dependencies]
# CLI integration tests spawn the `zymbol` binary. `CARGO_BIN_EXE_zymbol` is only
# exported to integration tests of the crate that declares the binary, so
# `cli_repl.rs` must live here rather than in zymbol-repl.
assert_cmd = "2"
predicates = "3"
tempfile = "3"
