[package]
name = "zymbol-analyzer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "LSP analysis engine for Zymbol-Lang"

[dependencies]
zymbol-span.workspace = true
zymbol-error.workspace = true
zymbol-lexer.workspace = true
zymbol-parser.workspace = true
zymbol-ast.workspace = true
zymbol-semantic.workspace = true
zymbol-common.workspace = true

lsp-types = "0.94"
dashmap = "6"
parking_lot = "0.12"
once_cell = "1"
walkdir = "2"
# The confusable skeleton of UTS #39, for the look-alike names hint (D-21).
unicode-security = "0.1.3"

[dev-dependencies]
tempfile = "3"
