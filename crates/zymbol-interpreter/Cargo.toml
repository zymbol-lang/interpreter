[package]
name = "zymbol-interpreter"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Interpreter for Zymbol-Lang"

[dependencies]
zymbol-span.workspace = true
zymbol-common.workspace = true
zymbol-error.workspace = true
zymbol-ast.workspace = true
zymbol-lexer.workspace = true
zymbol-parser.workspace = true
zymbol-semantic = { path = "../zymbol-semantic" }
# std/time: the civil calendar and the zone lookup, shared with the register VM
# so the two engines cannot disagree about what a month is.
zymbol-intrinsics.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
thiserror.workspace = true
crossterm = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true }
odbc-api = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
once_cell = { workspace = true, optional = true }

[features]
default = ["db"]
# std/db (ODBC). Disabled in prebuilt static binaries: the ODBC driver manager
# loads engine drivers with dlopen, which a fully static binary cannot do.
db = ["dep:odbc-api", "dep:base64", "dep:once_cell"]

[dev-dependencies]
zymbol-lexer.workspace = true
zymbol-parser.workspace = true
zymbol-compiler.workspace = true
zymbol-vm.workspace = true
