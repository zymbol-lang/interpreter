name: Build Linux packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload to (e.g. v0.0.5)'
        required: true

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
            musl_target: x86_64-unknown-linux-musl
            cross_linker_pkg: ''
            cross_linker_bin: ''
          - arch: aarch64
            rust_target: aarch64-unknown-linux-gnu
            musl_target: aarch64-unknown-linux-musl
            cross_linker_pkg: gcc-aarch64-linux-gnu
            cross_linker_bin: aarch64-linux-gnu-gcc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }},${{ matrix.musl_target }}

      - name: Read version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install packaging tools
        run: |
          sudo add-apt-repository universe -y
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            dpkg rpm-build zstd musl-tools \
            ${{ matrix.cross_linker_pkg }}

      - name: Configure cross-linker (aarch64 only)
        if: matrix.cross_linker_bin != ''
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<EOF
          [target.${{ matrix.rust_target }}]
          linker = "${{ matrix.cross_linker_bin }}"
          EOF

      - name: Build GNU binary
        run: cargo build --release --target ${{ matrix.rust_target }}

      - name: Expose binary at target/release/ for build-packages.sh
        run: |
          mkdir -p target/release
          cp "target/${{ matrix.rust_target }}/release/zymbol" target/release/zymbol

      - name: Build .deb, .rpm, .pkg.tar.zst
        run: |
          bash packaging/build-packages.sh \
            --arch ${{ matrix.arch }} \
            --formats deb,rpm,arch \
            --no-build \
            --no-timestamp \
            --out-dir packaging/dist

      - name: Build static musl binary
        run: |
          MUSL_TARGET="${{ matrix.musl_target }}"
          if [[ "${{ matrix.arch }}" == "aarch64" ]]; then
            cargo install cross --locked
            cross build --release --target "$MUSL_TARGET"
          else
            RUSTFLAGS="-C target-feature=+crt-static" \
              cargo build --release --target "$MUSL_TARGET"
          fi
          install -m755 \
            "target/$MUSL_TARGET/release/zymbol" \
            "packaging/dist/zymbol_lang_v${VERSION}_${{ matrix.arch }}_linux"

      - name: Compute SHA256
        run: |
          cd packaging/dist
          sha256sum \
            "zymbol_lang_v${VERSION}_${{ matrix.arch }}.deb" \
            "zymbol_lang_v${VERSION}_${{ matrix.arch }}.rpm" \
            "zymbol_lang_v${VERSION}_${{ matrix.arch }}.pkg.tar.zst" \
            "zymbol_lang_v${VERSION}_${{ matrix.arch }}_linux" \
            | tee "SHA256SUMS_${{ matrix.arch }}_linux.txt"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          cd packaging/dist
          gh release upload "$TAG" \
            "zymbol_lang_v${VERSION}_${{ matrix.arch }}.deb" \
            "zymbol_lang_v${VERSION}_${{ matrix.arch }}.rpm" \
            "zymbol_lang_v${VERSION}_${{ matrix.arch }}.pkg.tar.zst" \
            "zymbol_lang_v${VERSION}_${{ matrix.arch }}_linux" \
            "SHA256SUMS_${{ matrix.arch }}_linux.txt" \
            --clobber
