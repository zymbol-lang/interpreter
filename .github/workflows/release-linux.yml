name: Build Linux packages

# Three stages: build → verify → publish. Nothing reaches the release page until
# the .deb has been installed and exercised in a pristine Debian container, so a
# package that does not install can no longer be downloaded by anyone.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload to (e.g. v0.0.5)'
        required: true

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
            musl_target: x86_64-unknown-linux-musl
            cross_linker_pkg: musl-tools
            use_cross: false
          - arch: aarch64
            rust_target: aarch64-unknown-linux-gnu
            musl_target: aarch64-unknown-linux-musl
            cross_linker_pkg: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            use_cross: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }},${{ matrix.musl_target }}

      - name: Read version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            zstd ${{ matrix.cross_linker_pkg }}

      - name: Build GNU binary
        # --no-default-features: prebuilt Linux binaries exclude std/db — ODBC links
        # against system libodbc (undeclared package dependency) and the driver
        # manager needs dlopen, impossible in the static builds below.
        # verify-deb.sh enforces this: it fails the release if the packaged
        # binary links anything beyond libc.
        run: cargo build --release --no-default-features --target ${{ matrix.rust_target }}

      - name: Expose binary at target/release/ for build-packages.sh
        run: |
          mkdir -p target/release
          cp "target/${{ matrix.rust_target }}/release/zymbol" target/release/zymbol

      - name: Build .deb
        run: |
          bash packaging/build-packages.sh \
            --arch ${{ matrix.arch }} \
            --formats deb \
            --no-build \
            --no-timestamp

      - name: Build .pkg.tar.zst
        run: |
          bash packaging/build-packages.sh \
            --arch ${{ matrix.arch }} \
            --formats arch \
            --no-build \
            --no-timestamp

      - name: Build .rpm (Fedora container)
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            --workdir /workspace \
            fedora:40 \
            bash -c "
              dnf install -y rpm-build > /dev/null 2>&1 &&
              bash packaging/build-packages.sh \
                --arch ${{ matrix.arch }} \
                --formats rpm \
                --no-build \
                --no-timestamp
            "

      - name: Build static musl binary (x86_64 native)
        if: matrix.use_cross == false
        run: |
          RUSTFLAGS="-C target-feature=+crt-static" \
            cargo build --release --no-default-features --target ${{ matrix.musl_target }}
          install -m755 \
            "target/${{ matrix.musl_target }}/release/zymbol" \
            "packaging/dist/zymbol_lang_v${VERSION}_${{ matrix.arch }}_linux"

      - name: Build static musl binary (aarch64 via cross)
        if: matrix.use_cross == true
        run: |
          cargo install cross --locked
          cross build --release --no-default-features --target ${{ matrix.musl_target }}
          install -m755 \
            "target/${{ matrix.musl_target }}/release/zymbol" \
            "packaging/dist/zymbol_lang_v${VERSION}_${{ matrix.arch }}_linux"

      - name: Compute SHA256
        run: |
          cd packaging/dist
          sha256sum \
            "zymbol_lang_v${VERSION}_${{ matrix.arch }}.deb" \
            "zymbol_lang_v${VERSION}_${{ matrix.arch }}.rpm" \
            "zymbol_lang_v${VERSION}_${{ matrix.arch }}.pkg.tar.zst" \
            "zymbol_lang_v${VERSION}_${{ matrix.arch }}_linux" \
            | tee "SHA256SUMS_${{ matrix.arch }}_linux.txt"

      # Hand the packages to the verify and publish jobs instead of uploading
      # them here: the file that gets verified must be the file that ships.
      - name: Upload packages as artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ matrix.arch }}
          path: |
            packaging/dist/zymbol_lang_v*_${{ matrix.arch }}.deb
            packaging/dist/zymbol_lang_v*_${{ matrix.arch }}.rpm
            packaging/dist/zymbol_lang_v*_${{ matrix.arch }}.pkg.tar.zst
            packaging/dist/zymbol_lang_v*_${{ matrix.arch }}_linux
            packaging/dist/SHA256SUMS_${{ matrix.arch }}_linux.txt
          if-no-files-found: error
          retention-days: 7

  # Gate: the .deb x86_64 must install and pass the E2E suite in debian:12.
  # rpm / Arch / musl / aarch64 ride along unverified for now — extending this
  # is the next step (packaging/verify/README.md).
  verify-linux:
    name: Verify packages
    needs: build-linux
    permissions:
      contents: read
    uses: ./.github/workflows/verify-linux-packages.yml
    with:
      artifact: linux-packages-x86_64
      scope: full

  publish-linux:
    name: Publish to release
    needs: [build-linux, verify-linux]
    runs-on: ubuntu-22.04
    steps:
      - name: Download every Linux package
        uses: actions/download-artifact@v4
        with:
          pattern: linux-packages-*
          path: dist
          merge-multiple: true

      - name: List what is about to be published
        run: ls -lh dist

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job has no checkout, so gh needs to be told which repo it is in.
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          gh release upload "$TAG" dist/* --clobber
