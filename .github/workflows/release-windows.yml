name: Build Windows binary

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload to (e.g. v0.0.2)'
        required: true

permissions:
  contents: write
  id-token: write   # required by SignPath

jobs:
  build-windows:
    name: Windows x86_64 binary
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare asset
        shell: bash
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          ASSET="zymbol_lang_v${VERSION}_x86_64_windows.exe"
          cp target/x86_64-pc-windows-msvc/release/zymbol.exe "$ASSET"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Compute SHA256
        shell: bash
        run: |
          sha256sum "$ASSET" | tee SHA256_x86_64_windows.txt

      - name: Build MSI installer
        shell: bash
        run: |
          choco install wixtoolset --no-progress -y
          export PATH="/c/Program Files (x86)/WiX Toolset v3.14/bin:$PATH"

          MSI_ASSET="zymbol_lang_v${VERSION}_x86_64_windows.msi"
          GUID_UPGRADE="A1B2C3D4-E5F6-7890-ABCD-EF1234567890"

          mkdir -p msi_staging
          cp target/x86_64-pc-windows-msvc/release/zymbol.exe msi_staging/zymbol.exe
          cp LICENSE msi_staging/LICENSE 2>/dev/null || cp LICENSE-AGPL-3.0 msi_staging/LICENSE

          sed \
            -e "s/{{VERSION}}/${VERSION}/g" \
            -e "s/{{GUID_UPGRADE}}/${GUID_UPGRADE}/g" \
            packaging/templates/zymbol.wxs.in > msi_staging/zymbol.wxs

          cd msi_staging
          candle.exe zymbol.wxs -arch x64 -o zymbol.wixobj
          light.exe zymbol.wixobj -o "../${MSI_ASSET}"
          cd ..

          echo "MSI_ASSET=$MSI_ASSET" >> "$GITHUB_ENV"

      - name: Rename MSI to fixed name for signing
        shell: bash
        run: cp "${MSI_ASSET}" zymbol-lang.msi

      - name: Upload unsigned MSI as artifact
        id: upload-unsigned-msi
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-unsigned
          path: zymbol-lang.msi
          if-no-files-found: error

      # SignPath needs both secrets. When they are absent the action stops with a
      # bare "Input required and not supplied: api-token" — which, while this job
      # still had `continue-on-error: true` and an unsigned fallback, quietly
      # published unsigned binaries instead. That is how v0.0.8 shipped: the run
      # was green, the step reported success (continue-on-error always does), and
      # the unsigned .exe and .msi sat on the release page until someone hashed
      # them. Fail here instead, and say what to do about it.
      - name: Require signing credentials
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG_ID: ${{ secrets.SIGNPATH_ORG_ID }}
        run: |
          missing=()
          [[ -n "${SIGNPATH_API_TOKEN}" ]] || missing+=(SIGNPATH_API_TOKEN)
          [[ -n "${SIGNPATH_ORG_ID}" ]]    || missing+=(SIGNPATH_ORG_ID)
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing repository secret(s): ${missing[*]}"
            echo "::error::Nothing is uploaded — this workflow does not publish unsigned Windows binaries."
            echo "::error::Either configure the secrets, or sign by hand in the SignPath portal and upload with:"
            echo "::error::  gh release upload <tag> <exe> <msi> SHA256_x86_64_windows.txt SHA256_x86_64_windows_msi.txt --clobber"
            exit 1
          fi

      - name: Sign MSI via SignPath
        id: sign-msi
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token:                    ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id:              ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug:                 zymbol-lang
          signing-policy-slug:          release-signing
          artifact-configuration-slug:  windows-installer
          github-artifact-id:           ${{ steps.upload-unsigned-msi.outputs.artifact-id }}
          wait-for-completion:          true
          output-artifact-directory:    signed

      - name: Rename signed MSI back to versioned name
        shell: bash
        run: |
          cp signed/zymbol-lang.msi "${MSI_ASSET}"
          sha256sum "${MSI_ASSET}" | tee SHA256_x86_64_windows_msi.txt

      # A signing step that reports success but hands back an untouched file
      # would publish an unsigned installer with signed-looking provenance. The
      # only thing that settles it is looking at the artifact about to ship.
      - name: Confirm the MSI carries a signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "$env:MSI_ASSET"
          "Status: $($sig.Status)"
          "Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -eq 'NotSigned') {
            Write-Output "::error::$env:MSI_ASSET has no embedded signature — refusing to publish"
            exit 1
          }

      # Asymmetry on purpose: only the .msi goes through SignPath, so the .exe
      # published here is unsigned. Signing it too needs its own SignPath
      # artifact-configuration; until that exists, sign it by hand and re-upload
      # with --clobber (that is what v0.0.8 did).
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          gh release upload "$TAG" "$ASSET" "${MSI_ASSET}" \
            SHA256_x86_64_windows.txt SHA256_x86_64_windows_msi.txt --clobber
