name: Build Windows installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload to (e.g. v0.0.2)'
        required: true

permissions:
  contents: write
  id-token: write   # required by SignPath

jobs:
  build-windows:
    name: Windows x86_64 installer
    runs-on: windows-latest
    outputs:
      signable:    ${{ steps.signable.outputs.ok }}
      artifact-id: ${{ steps.upload-unsigned-msi.outputs.artifact-id }}
      msi-asset:   ${{ steps.msi-name.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # `--features db`: on Windows ODBC is part of the OS (odbc32.dll), so the
      # release keeps std/db, which stopped being a default feature in v0.0.11
      # (D4) — without the flag this binary would quietly lose it.
      - name: Build
        run: cargo build --release --features db --target x86_64-pc-windows-msvc

      # Windows ships as the .msi only. The bare .exe used to be published beside
      # it, but only the .msi goes through SignPath, so the .exe was the one
      # artifact on the release page that could never carry a signature — the
      # worst thing to hand a Windows user, since it is also the one SmartScreen
      # complains about loudest. The installer puts the same binary on PATH.
      - name: Read version
        shell: bash
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build MSI installer
        shell: bash
        run: |
          choco install wixtoolset --no-progress -y
          export PATH="/c/Program Files (x86)/WiX Toolset v3.14/bin:$PATH"

          MSI_ASSET="zymbol_lang_v${VERSION}_x86_64_windows.msi"
          GUID_UPGRADE="A1B2C3D4-E5F6-7890-ABCD-EF1234567890"

          mkdir -p msi_staging
          cp target/x86_64-pc-windows-msvc/release/zymbol.exe msi_staging/zymbol.exe
          cp LICENSE msi_staging/LICENSE 2>/dev/null || cp LICENSE-AGPL-3.0 msi_staging/LICENSE

          sed \
            -e "s/{{VERSION}}/${VERSION}/g" \
            -e "s/{{GUID_UPGRADE}}/${GUID_UPGRADE}/g" \
            packaging/templates/zymbol.wxs.in > msi_staging/zymbol.wxs

          cd msi_staging
          candle.exe zymbol.wxs -arch x64 -o zymbol.wixobj
          light.exe zymbol.wixobj -o "../${MSI_ASSET}"
          cd ..

          echo "MSI_ASSET=$MSI_ASSET" >> "$GITHUB_ENV"

      - name: Name the MSI for the signing job
        id: msi-name
        shell: bash
        run: echo "name=${MSI_ASSET}" >> "$GITHUB_OUTPUT"

      - name: Rename MSI to fixed name for signing
        shell: bash
        run: cp "${MSI_ASSET}" zymbol-lang.msi

      - name: Upload unsigned MSI as artifact
        id: upload-unsigned-msi
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-unsigned
          path: zymbol-lang.msi
          if-no-files-found: error

      # SignPath needs both secrets. When they are absent the action stops with a
      # bare "Input required and not supplied: api-token" — which, while this job
      # still had `continue-on-error: true` and an unsigned fallback, quietly
      # published unsigned binaries instead. That is how v0.0.8 shipped: the run
      # was green, the step reported success (continue-on-error always does), and
      # the unsigned .exe and .msi sat on the release page until someone hashed
      # them. So nothing unsigned is ever uploaded — but until v0.0.11 the absence
      # of the secrets was reported as a FAILURE, and every release carried a red
      # run that had to be known to be harmless (10-12, 10-31, 11-01). A red that
      # means "as designed" teaches everyone to ignore red. Since v0.0.12 (D-11)
      # the signing job below runs only when the secrets exist, shows as SKIPPED
      # otherwise, and this summary says what to do by hand.
      - name: Is signing possible here
        id: signable
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG_ID: ${{ secrets.SIGNPATH_ORG_ID }}
        run: |
          if [[ -n "${SIGNPATH_API_TOKEN}" && -n "${SIGNPATH_ORG_ID}" ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=false" >> "$GITHUB_OUTPUT"
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          {
            echo "## MSI built — NOT signed, NOT uploaded"
            echo
            echo "The SignPath secrets are not configured (\`packaging/SIGNING.md\`), so the signing job is skipped."
            echo "This workflow never publishes an unsigned Windows binary."
            echo
            echo "1. Download the artifact \`windows-msi-unsigned\` from this run."
            echo "2. Sign it in the SignPath portal."
            echo "3. Upload it, named \`${MSI_ASSET}\`:"
            echo
            echo '```'
            echo "sha256sum -b ${MSI_ASSET} > SHA256_x86_64_windows_msi.txt"
            echo "gh release upload ${TAG} ${MSI_ASSET} SHA256_x86_64_windows_msi.txt --clobber"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::MSI built and kept as an artifact; signing skipped (no SignPath secrets) — see the run summary"

  sign-and-upload:
    name: Sign the MSI and upload it
    needs: build-windows
    if: needs.build-windows.outputs.signable == 'true'
    runs-on: windows-latest
    env:
      MSI_ASSET: ${{ needs.build-windows.outputs.msi-asset }}

    steps:
      - name: Sign MSI via SignPath
        id: sign-msi
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token:                    ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id:              ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug:                 zymbol-lang
          signing-policy-slug:          release-signing
          artifact-configuration-slug:  windows-installer
          github-artifact-id:           ${{ needs.build-windows.outputs.artifact-id }}
          wait-for-completion:          true
          output-artifact-directory:    signed

      - name: Rename signed MSI back to versioned name
        shell: bash
        run: |
          cp signed/zymbol-lang.msi "${MSI_ASSET}"
          sha256sum "${MSI_ASSET}" | tee SHA256_x86_64_windows_msi.txt

      # A signing step that reports success but hands back an untouched file
      # would publish an unsigned installer with signed-looking provenance. The
      # only thing that settles it is looking at the artifact about to ship.
      - name: Confirm the MSI carries a signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "$env:MSI_ASSET"
          "Status: $($sig.Status)"
          "Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -eq 'NotSigned') {
            Write-Output "::error::$env:MSI_ASSET has no embedded signature — refusing to publish"
            exit 1
          }

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}   # this job has no checkout to read it from
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          gh release upload "$TAG" "${MSI_ASSET}" \
            SHA256_x86_64_windows_msi.txt --clobber
