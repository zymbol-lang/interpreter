[workspace]
resolver = "3"

members = [
    "crates/zymbol-span",
    "crates/zymbol-error",
    "crates/zymbol-common",
    "crates/zymbol-ast",
    "crates/zymbol-lexer",
    "crates/zymbol-parser",
    "crates/zymbol-interpreter",
    "crates/zymbol-standalone",
    "crates/zymbol-cli",
    "crates/zymbol-semantic",
    "crates/zymbol-analyzer",
    "crates/zymbol-lsp",
    "crates/zymbol-formatter",
    "crates/zymbol-repl",
    "crates/zymbol-bytecode",
    "crates/zymbol-vm",
    "crates/zymbol-compiler",
    "crates/zymbol-intrinsics",
    "crates/zymbol-package",
]

[workspace.package]
version = "0.0.9"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
authors = ["Zymbol-Lang Contributors"]
repository = "https://github.com/zymbol-lang/interpreter"

[workspace.dependencies]
# Internal crates
zymbol-span = { path = "crates/zymbol-span" }
zymbol-error = { path = "crates/zymbol-error" }
zymbol-common = { path = "crates/zymbol-common" }
zymbol-ast = { path = "crates/zymbol-ast" }
zymbol-lexer = { path = "crates/zymbol-lexer" }
zymbol-parser = { path = "crates/zymbol-parser" }
zymbol-semantic = { path = "crates/zymbol-semantic" }
zymbol-interpreter = { path = "crates/zymbol-interpreter", default-features = false }
zymbol-bytecode = { path = "crates/zymbol-bytecode" }
zymbol-vm = { path = "crates/zymbol-vm", default-features = false }
zymbol-compiler = { path = "crates/zymbol-compiler", default-features = false }
zymbol-intrinsics = { path = "crates/zymbol-intrinsics" }
zymbol-standalone = { path = "crates/zymbol-standalone" }
zymbol-analyzer = { path = "crates/zymbol-analyzer" }
zymbol-formatter = { path = "crates/zymbol-formatter" }
zymbol-repl = { path = "crates/zymbol-repl" }
zymbol-package = { path = "crates/zymbol-package" }

# Unicode handling
unicode-segmentation = "1.12"
unicode-width = "0.2"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# CLI tools
clap = { version = "4.6", features = ["derive", "cargo"] }

# Terminal/REPL
crossterm = "0.29"
arboard = "3.4"

# Colors and formatting
owo-colors = "4.0"

# Data structures
indexmap = "2.2"

# Serialization (for bytecode)
# bincode stays on 1.x deliberately: 2.x/3.x changes the wire format, and the
# standalone template embeds bincode-serialized bytecode that the generated
# project must deserialize with the identical version.
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

# HTTP (std/net) — synchronous, blocking
ureq = "3"

# Database (std/db) — vendor-neutral via the ODBC driver manager (unixODBC).
# Zymbol compiles no vendor DB code; the OS supplies the per-engine ODBC driver.
odbc-api = "28"
base64 = "0.22"
once_cell = "1"

# Zymbol Package (.zyp): portable source archives
# default-features = false on `zip` skips bzip2/zstd/aes — only deflate is needed.
zip = { version = "2", default-features = false, features = ["deflate"] }
toml = "0.8"
semver = "1"
tempfile = "3.13"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
